<title>PROTOTYPE – Wheelhouse and Engine Room look and sound (throwaway)</title>
<!--
  PROTOTYPE · THROWAWAY · never merged.
  Question (wayfinder ticket "What do the Wheelhouse and the Engine Room look and sound like?"):
  palette, lighting and mood for each Room; how dressed they need to be; what sound each Deck has, the
  feedback sounds, and whether the Voice Pipe has a sound; the drawn ship name and the end cards.

  Four looks of the same two Rooms, switchable with ?variant=A|B|C|D, the bottom bar, or [ and ]:
    A  Fire below, storm above   hot furnace light under a cold storm: maximum temperature contrast between Decks
    B  Brass and teak            both Decks candle-warm; told apart by material and scale (soot iron / polished teak)
    C  Verdigris deep            teal gaslight, portholes onto green water, a muffled submerged mix
    D  Greybox                   the C10 floor: same layout, neutral grey, even light, no textures
  "g" (or the Greybox button) flips any look to greybox. Everything is built from three.js primitives and canvas
  textures: nothing here is a CC0 asset. The Tools panel fires the feedback sounds and the end cards.

  The Rooms keep the layout the earlier prototypes settled: in the Wheelhouse the middle 5x5 of the floor stays clear
  for the rotten-floor Puzzle, so its dressing sits round the rim. Movement is WASD + mouse look (pointer lock) or a
  joystick on a coarse pointer; click or tap a keypad key, valve wheel, telegraph handle or helm within 2.2 m to hear it.
  ?deck=1|2  Engine Room | Wheelhouse   ?ship=Name   ?lock=0   ?stick=1   ?card=launched|sunk|paused   ?tools=1
  Sound is procedural Web Audio (no files) and starts on the first click, tap or key.
  three.js 0.170 loads from jsdelivr, so this needs a network connection.
-->

<script type="module">
import * as THREE from 'three';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const q = new URLSearchParams(location.search);
const coarse = matchMedia('(pointer:coarse)').matches;
const SHIPS = ['Aurelia', 'Marguerite', 'Nautilus Rose', 'Corvina', 'Halcyon', 'Brigid'];
const cfg = { variant: (q.get('variant') || 'A').toUpperCase(), deck: +(q.get('deck') || 1), grey: q.get('grey') === '1', ship: q.get('ship') || SHIPS[0],
  stick: coarse || q.get('stick') === '1', lock: !coarse && q.get('lock') !== '0' };
const REACH = 2.2;

/* ============================================================
   THE LOOKS. One table per look; the builders below read it. Colours are hex, lights are [colour, intensity].
   e = Engine Room (Lower Deck), w = Wheelhouse (Upper Deck).
   ============================================================ */
const THEMES = {
  A: { name: 'Fire below, storm above', view: 'storm', windows: 'panes', filt: 16000, card: 'brass', mix: { rain: 1, wind: 1, sub: 1, creak: 1 },
    e: { wall: 0x6a4a36, floor: 0x2a2622, ceil: 0x17120f, trim: 0xb8863b, amb: [0x5a3320, 0.55], fog: [0x0d0705, 0.065], furnace: 1, lamp: [0xffb35a, 9] },
    w: { wall: 0x7c879a, wood: 0x6b4a2f, floor: 0x3d2e22, ceil: 0x1c2330, trim: 0xcaa24a, amb: [0x8da6d4, 0.6], fog: [0x0a0e18, 0.03], lamp: [0xffd9a0, 5] } },
  B: { name: 'Brass and teak', view: 'dusk', windows: 'panes', filt: 9000, card: 'log', mix: { rain: 0.15, wind: 0.5, sub: 0.8, creak: 1.7 },
    e: { wall: 0x4a4540, floor: 0x2b2723, ceil: 0x1a1614, trim: 0xd0a040, amb: [0x7a5a38, 0.55], fog: [0x15100c, 0.04], furnace: 0.6, lamp: [0xffc070, 12] },
    w: { wall: 0x9a6c40, wood: 0x6e4527, floor: 0x4a3320, ceil: 0x2a1c12, trim: 0xd8aa48, amb: [0xb89066, 0.6], fog: [0x1a120a, 0.028], lamp: [0xffc874, 10] } },
  C: { name: 'Verdigris deep', view: 'sea', windows: 'portholes', filt: 1800, card: 'blueprint', mix: { rain: 0, wind: 0.15, sub: 1.5, creak: 1.2 },
    e: { wall: 0x3c5e58, floor: 0x1c2a29, ceil: 0x0e1817, trim: 0xa9b98a, amb: [0x2c5a52, 0.6], fog: [0x041211, 0.07], furnace: 0.5, lamp: [0xb8ffd8, 10] },
    w: { wall: 0x3f6760, wood: 0x5b4a36, floor: 0x2d3b36, ceil: 0x142320, trim: 0xb8c590, amb: [0x4a8a80, 0.65], fog: [0x04100f, 0.045], lamp: [0xc8fff0, 6] } },
};
THEMES.D = { ...THEMES.A, name: 'Greybox (the C10 floor)', grey: true, card: 'brass' };
const ORDER = Object.keys(THEMES);
let T, grey, deck, C;

/* ============================================================
   MATERIALS AND TEXTURES: all procedural, so the prototype needs no files
   ============================================================ */
const lum = c => { const k = new THREE.Color(c); return 0.2126 * k.r + 0.7152 * k.g + 0.0722 * k.b; };
const M = (c, o = {}) => new THREE.MeshLambertMaterial(grey ? { color: new THREE.Color().setScalar(0.25 + 0.7 * Math.sqrt(lum(c))) } : { color: c, ...o });
const MT = (map, o = {}) => new THREE.MeshLambertMaterial(grey ? { color: 0x9a9a9a } : { map, ...o });
const EM = c => new THREE.MeshBasicMaterial({ color: c, fog: false });
const canvasTex = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
const dyn = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { tex: t, draw: (...a) => { draw(x, w, h, ...a); t.needsUpdate = true; } }; };
const hex = c => '#' + new THREE.Color(c).getHexString();
const shade = (c, k) => '#' + new THREE.Color(c).multiplyScalar(k).getHexString();
const rivetTex = (base, rep) => canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = hex(base); x.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) { x.fillStyle = `rgba(0,0,0,${Math.random() * 0.1})`; x.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 6, 1 + Math.random() * 2); }
  x.strokeStyle = shade(base, 0.55); x.lineWidth = 3; x.strokeRect(1, 1, w - 2, h - 2); x.beginPath(); x.moveTo(0, h / 2); x.lineTo(w, h / 2); x.stroke();
  for (let k = 0; k < 8; k++) for (const y of [10, h / 2 - 10, h / 2 + 10, h - 10]) { const px = 16 + k * 32; x.fillStyle = shade(base, 0.5); x.beginPath(); x.arc(px + 1, y + 1.5, 4, 0, 7); x.fill(); x.fillStyle = shade(base, 1.45); x.beginPath(); x.arc(px, y, 3.4, 0, 7); x.fill(); }
}, rep);
const plankTex = (base, rep, vertical) => canvasTex(256, 256, (x, w, h) => {
  for (let i = 0; i < 8; i++) { x.fillStyle = shade(base, 0.8 + Math.random() * 0.4); vertical ? x.fillRect(i * 32, 0, 32, h) : x.fillRect(0, i * 32, w, 32); }
  for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(0,0,0,${Math.random() * 0.12})`; vertical ? x.fillRect(Math.random() * w, Math.random() * h, 1, 10 + Math.random() * 40) : x.fillRect(Math.random() * w, Math.random() * h, 10 + Math.random() * 40, 1); }
  x.fillStyle = 'rgba(0,0,0,.55)'; for (let i = 0; i < 8; i++) vertical ? x.fillRect(i * 32, 0, 2, h) : x.fillRect(0, i * 32, w, 2);
}, rep);
const gratingTex = (rep) => canvasTex(128, 128, (x, w, h) => {
  x.fillStyle = '#0e0c0a'; x.fillRect(0, 0, w, h); x.strokeStyle = '#6a6056'; x.lineWidth = 5;
  for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(i * 32, 0); x.lineTo(i * 32, h); x.stroke(); x.beginPath(); x.moveTo(0, i * 32); x.lineTo(w, i * 32); x.stroke(); }
}, rep);
const textTex = (txt, w, h, bg, fg, font, border) => canvasTex(w, h, (x) => { x.fillStyle = bg; x.fillRect(0, 0, w, h); if (border) { x.strokeStyle = border; x.lineWidth = 6; x.strokeRect(5, 5, w - 10, h - 10); } x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, w / 2, h / 2 + 3); });
const glowTex = canvasTex(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });
const puffTex = canvasTex(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });

/* ============================================================
   THE VIEW OUT OF THE WINDOWS: one animated canvas, three kinds
   ============================================================ */
const L = { flash: 0, next: 6, jolt: 0, dim: 0 };      // lightning, a Strike's shake, and the lamps guttering
function drawView(x, w, h, t, kind) {
  const roll = Math.sin(t * 0.45) * 16, hor = h * 0.58;
  if (kind === 'sea') {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0f3a37'); g.addColorStop(1, '#03100f'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 5; i++) { const px = ((i * 230 + t * 12) % (w + 200)) - 100; x.fillStyle = 'rgba(160,255,220,.05)'; x.beginPath(); x.moveTo(px, 0); x.lineTo(px + 90, 0); x.lineTo(px + 10, h); x.lineTo(px - 80, h); x.fill(); }
    for (let i = 0; i < 40; i++) { const px = (i * 97 + 31) % w, py = h - ((t * (14 + (i % 5) * 6) + i * 53) % (h + 20)); x.strokeStyle = 'rgba(190,255,235,.45)'; x.lineWidth = 1.5; x.beginPath(); x.arc(px, py, 2 + (i % 4), 0, 7); x.stroke(); }
    return;
  }
  const storm = kind === 'storm', g = x.createLinearGradient(0, 0, 0, hor);
  if (storm) { g.addColorStop(0, '#080b12'); g.addColorStop(1, '#3d4a5e'); } else { g.addColorStop(0, '#3a3a40'); g.addColorStop(0.7, '#9a7a56'); g.addColorStop(1, '#d9a76a'); }
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) { const px = ((i * 170 + t * (storm ? 38 : 14)) % (w + 300)) - 150, py = 30 + (i % 4) * 36; x.fillStyle = storm ? 'rgba(10,14,22,.5)' : 'rgba(70,60,60,.35)'; x.beginPath(); x.ellipse(px, py, 120, 26, 0, 0, 7); x.fill(); }
  const s = x.createLinearGradient(0, hor, 0, h); s.addColorStop(0, storm ? '#1c2736' : '#4b3b30'); s.addColorStop(1, storm ? '#04070c' : '#1a130e'); x.fillStyle = s;
  x.beginPath(); x.moveTo(0, h); for (let i = 0; i <= 32; i++) x.lineTo(i * w / 32, hor + (i / 32 - 0.5) * roll + Math.sin(i * 1.3 + t * (storm ? 2.4 : 1.2)) * (storm ? 9 : 4)); x.lineTo(w, h); x.fill();
  x.strokeStyle = storm ? 'rgba(210,225,240,.35)' : 'rgba(255,230,190,.3)'; x.lineWidth = 2;
  for (let i = 0; i < 26; i++) { const px = (i * 61 + t * 55) % w, py = hor + 14 + (i * 37) % (h - hor - 16); x.beginPath(); x.moveTo(px, py); x.lineTo(px + 26, py + Math.sin(i + t * 2)); x.stroke(); }
  if (storm) { x.strokeStyle = 'rgba(200,215,235,.45)'; x.lineWidth = 1.2; for (let i = 0; i < 90; i++) { const px = (i * 53 + t * 260) % (w + 40) - 20, py = (i * 91 + t * 700) % h; x.beginPath(); x.moveTo(px, py); x.lineTo(px - 7, py + 24); x.stroke(); } }
  if (L.flash > 0) { x.fillStyle = `rgba(235,242,255,${Math.min(0.85, L.flash * 0.9)})`; x.fillRect(0, 0, w, h); }
}

/* ============================================================
   SOUND: procedural Web Audio. Nothing here is a file, and nothing speaks: sound sits under talking, never in place of it.
   ============================================================ */
const A = { ctx: null, on: false, amb: 0.5, fx: 0.9, pipeBed: false, duck: false, nodes: [], timers: [] };
const SND = {};
function audioStart() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  try { A.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  const c = A.ctx; A.on = true;
  A.filt = c.createBiquadFilter(); A.filt.type = 'lowpass'; A.filt.Q.value = 0.5; A.filt.connect(c.destination);
  A.master = c.createGain(); A.master.gain.value = 0.9; A.master.connect(A.filt);
  A.ambG = c.createGain(); A.ambG.connect(A.master); A.duckG = c.createGain(); A.duckG.connect(A.ambG);
  A.fxG = c.createGain(); A.fxG.connect(A.master);
  A.an = c.createAnalyser(); A.an.fftSize = 2048; A.master.connect(A.an);
  const mk = (kind) => { const n = c.sampleRate * 3, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0); let last = 0;
    for (let i = 0; i < n; i++) { const wn = Math.random() * 2 - 1; if (kind === 'brown') { last = (last + 0.02 * wn) / 1.02; d[i] = last * 3.5; } else d[i] = wn; } return b; };
  A.white = mk('white'); A.brown = mk('brown');
  $('#snd').style.display = 'none'; applyMix(); setAmbience();
}
function applyMix() { if (!A.ctx) return; const t = A.ctx.currentTime; A.ambG.gain.setTargetAtTime(A.amb, t, 0.1); A.fxG.gain.setTargetAtTime(A.fx, t, 0.1); A.duckG.gain.setTargetAtTime(A.duck ? 0.3 : 1, t, 0.12); A.filt.frequency.setTargetAtTime(T.filt, t, 0.3); }
const nz = (kind, loop = true) => { const s = A.ctx.createBufferSource(); s.buffer = kind === 'brown' ? A.brown : A.white; s.loop = loop; s.start(0, Math.random() * 2); return s; };
const chain = (src, ...nodes) => { let n = src; for (const x of nodes) { n.connect(x); n = x; } return n; };
const bq = (type, f, Q = 1) => { const b = A.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; };
const gn = v => { const g = A.ctx.createGain(); g.gain.value = v; return g; };
function lfo(rate, depth, param, ctxTarget) { const o = A.ctx.createOscillator(); o.frequency.value = rate; const g = gn(depth); o.connect(g); g.connect(param); o.start(); ctxTarget.push(o); }
function env(g, t0, a, peak, d) { g.gain.cancelScheduledValues(t0); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
function setAmbience() {
  if (!A.ctx) return; const c = A.ctx, now = c.currentTime;
  A.timers.forEach(clearTimeout); A.timers = [];
  const old = A.nodes; A.nodes = [];
  if (A.bus) { const b = A.bus; b.gain.setTargetAtTime(0, now, 0.25); setTimeout(() => { old.forEach(n => { try { n.stop(); } catch {} }); b.disconnect(); }, 1500); }

function drawTools() {
  const b = (id, label, on) => `<button data-do="${id}" class="${on ? 'on' : ''}">${label}</button>`;
  $('#tools').innerHTML = `<h4>Sounds</h4><div class="g">${b('strike', 'Strike')}${b('solve', 'Puzzle solved')}${b('warn5', '5 minutes left')}${b('partner-j', 'Partner joins the pipe')}${b('partner-l', 'Partner leaves')}${b('thunder', 'Thunder')}</div>
  <h4>Mix</h4><div class="g"><label>Ambience <input type="range" min="0" max="1" step="0.05" value="${A.amb}" data-mix="amb"></label><label>Effects <input type="range" min="0" max="1" step="0.05" value="${A.fx}" data-mix="fx"></label>${b('bed', 'Voice Pipe air bed', A.pipeBed)}${b('duck', 'Hold T: duck while talking', A.duck)}</div>
  <h4>Cards</h4><div class="g">${b('c-launched', 'Lifeboat launched')}${b('c-sunk', 'Going down')}${b('c-paused', 'Paused')}${b('name', 'New ship name')}</div>
  <h4>View</h4><div class="g">${b('deck', 'Deck: ' + (deck === 1 ? 'Engine Room' : 'Wheelhouse') + ' ⇄')}${b('grey', 'Greybox', cfg.grey)}${b('pop', 'Other Deck in a new window')}</div>`;
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-do]'), cd = e.target.closest('[data-card]');
  if (cd) { showCard(null); return; }
  if (!m) return; audioStart(); const k = m.dataset.do;
  if (k === 'strike' || k === 'solve' || k === 'warn5' || k === 'thunder') play(k);
  else if (k === 'partner-j') play('partner', true); else if (k === 'partner-l') play('partner', false);
  else if (k === 'bed') { A.pipeBed = !A.pipeBed; pipeBed(); } else if (k === 'duck') { A.duck = !A.duck; applyMix(); }
  else if (k.startsWith('c-')) { showCard(k.slice(2)); return; }
  else if (k === 'name') { cfg.ship = SHIPS[(SHIPS.indexOf(cfg.ship) + 1) % SHIPS.length]; rebuild(); }
  else if (k === 'deck') { cfg.deck = 3 - cfg.deck; rebuild(); }
  else if (k === 'grey') { cfg.grey = !cfg.grey; rebuild(); }
  else if (k === 'pop') open(location.pathname + '?' + new URLSearchParams({ variant: cfg.variant, deck: 3 - deck, ship: cfg.ship, grey: cfg.grey ? 1 : 0 }), 'deck' + (3 - deck), 'width=420,height=900');
  drawTools();
});
document.addEventListener('input', e => { const r = e.target.closest('[data-mix]'); if (!r) return; A[r.dataset.mix] = +r.value; applyMix(); });
$('#toolbtn').onclick = () => { $('#tools').classList.toggle('open'); drawTools(); };
function syncUi() { const locked = renderer && document.pointerLockElement === renderer.domElement; $('#crosshair').style.display = cfg.lock && locked ? 'block' : 'none'; $('#lockhint').style.display = cfg.lock && !locked ? 'block' : 'none'; $('#stick').style.display = cfg.stick ? 'block' : 'none'; }
function hud() {
  const R = deck === 1 ? ['Lower Deck', 'Engine Room'] : ['Upper Deck', 'Wheelhouse'];
  $('#help').innerHTML = `<b>${cfg.variant} · ${T.name}</b>${grey ? ' · greybox' : ''}${cfg.stick ? '' : '<br>WASD walk · click to look · click again to use · [ ] looks · g greybox · hold T duck'}`;
  $('#hint').innerHTML = `<b>${R[0]} · ${R[1]}</b> · S.S. ${cfg.ship}`;
  $('#vlabel').textContent = cfg.variant + ' · ' + T.name;
  const u = new URL(location); u.searchParams.set('variant', cfg.variant); u.searchParams.set('deck', deck); u.searchParams.set('ship', cfg.ship); u.searchParams.set('grey', cfg.grey ? 1 : 0); try { history.replaceState(null, '', u); } catch {}
}
function rebuild() { buildScene(); applyMix(); setAmbience(); hud(); syncUi(); showCard(null); if ($('#tools').classList.contains('open')) drawTools(); }
function cycle(d) { cfg.variant = ORDER[(ORDER.indexOf(cfg.variant) + d + ORDER.length) % ORDER.length]; rebuild(); }
$('#prev').onclick = () => cycle(-1); $('#next').onclick = () => cycle(1);

/* ============================================================
   BOOT
   ============================================================ */
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { document.body.insertAdjacentHTML('afterbegin', '<div class="nogl">WebGL is unavailable here. A real build would fall back to the 2D view.</div>'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); $('#view').append(renderer.domElement);
camera = new THREE.PerspectiveCamera(70, 1, 0.05, 40); camera.rotation.order = 'YXZ';
const fit = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? Math.min(105, 2 * Math.atan(Math.tan(37.5 * Math.PI / 180) / (w / h)) * 180 / Math.PI) : 70; camera.updateProjectionMatrix(); };
addEventListener('resize', fit); fit(); bindCanvas();
buildScene(); hud(); syncUi(); if (q.get('tools') === '1') { $('#tools').classList.add('open'); drawTools(); } if (q.get('card')) showCard(q.get('card'));
window.__proto = { cfg, A, audioStart, play, get deck() { return deck; }, showCard, P, rebuild };
requestAnimationFrame(frame);
</script>
