<title>PROTOTYPE – usable-thing cue (throwaway)</title>
<!--
  PROTOTYPE · THROWAWAY · never merged.
  Question (wayfinder ticket "What tells a Player that a thing within reach can be used?"): what marks a thing
  as usable once you are within about 2.2 m and facing it, on desktop (mouse look, crosshair) and on touch
  (joystick, no hover), what a tap that does nothing shows or plays, and whether Rooms hold ordinary things
  that can be examined but are part of no Puzzle.

  Built on prototype/in-scene, always "in place" (the settled scheme): walk up, press the 3D controls. Five cues,
  switchable with ?variant=A|B|C|D|E, the floating bottom bar, or [ and ]:
    A  No cue        the control: nothing marks what can be used.
    B  Glow          a brass rim-light on a live thing that is in reach and in front. Brighter under the crosshair.
    C  Reticle       the crosshair (a centre dot on touch) turns into a ring with the thing's name.
    D  Pilot lamp    each machine wears a small brass lamp: dark when idle or out of reach, lit amber in reach.
    E  Cursor        the mouse cursor becomes a hand over a live thing (needs point-and-click; none on touch).
  "Live" means it does something right now: rusted valves and the dark instrument wall are not live until their stage.

  Toggles in the bar (also ?miss=0..3 and ?ords=cued|plain|off):
    Miss    what a tap that uses nothing shows: off, ripple, ripple + tock, ripple + tock + words.
    Things  ordinary things (tool rack, maker's plate, lifebelt, barometer, Voice Pipe, chart) that can be
            examined and are part of no Puzzle: cued like the rest, plain (no cue), or absent.
  Usual controls: ?lock=0 turns off pointer lock (cursor, click to use); ?stick=1 forces the joystick; ?deck=1|2
  picks the Lower Deck (Engine Room) or Upper Deck (Wheelhouse); ?probe=1 shows each control's size on screen.
  Both Decks share one Voyage through localStorage (key PROTOTYPE-usable-cue-wipe-me). three.js loads from jsdelivr.
-->

  .lbl { color:#78716c; font-size:13px; }

  #switcher { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:4px; background:#0f172a; color:#fff; padding:5px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.45); font-size:13px; white-space:nowrap; max-width:calc(100% - 12px); }

  #switcher span { padding:0 8px; overflow:hidden; text-overflow:ellipsis; }

  #crosshair.dot { width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:rgba(255,255,255,.6); }
  #crosshair.live::before, #crosshair.live::after, #crosshair.dot::before, #crosshair.dot::after { display:none; }

  .ripple { position:fixed; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; border:2px solid rgba(255,255,255,.9); pointer-events:none; z-index:9; animation:rip .5s ease-out forwards; }
  @keyframes rip { to { transform:scale(5); opacity:0; } }
  #plaque { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); width:min(420px, calc(100% - 24px)); box-sizing:border-box; background:linear-gradient(#b08d4a,#8a6a2c); color:#1c1409; border:2px solid #e6c981; border-radius:6px; padding:8px 12px; text-align:center; font-family:Georgia, serif; display:none; z-index:7; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #plaque.miss { bottom:230px; width:auto; max-width:calc(100% - 24px); background:rgba(0,0,0,.72); color:#e7e5e4; border:0; font-family:inherit; padding:5px 12px; border-radius:999px; box-shadow:none; }

<div id="view"></div>
<div class="hud">
  <div class="chip small" id="help"></div>

<script type="module">
let THREE = null;
try { THREE = await import('three'); } catch (e) { console.warn('three.js failed to load', e); }
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================
   PURE LOGIC (carried over from the world-form prototype; rules stay server-side in a real build).
   Player 1 = Lower Deck (Engine Room), Player 2 = Upper Deck (Wheelhouse).
   ============================================================ */
const rng = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const shuffle = (r, arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SYMBOLS = ['▲', '●', '■', '★', '◆', '✚'];
const N = 5, START = [2, 4];
function init(seed) {
  const r = rng(seed);
  const code = shuffle(r, SYMBOLS).slice(0, 3);
  const glyph = Array.from({ length: N }, () => Array.from({ length: N }, () => SYMBOLS[Math.floor(r() * SYMBOLS.length)]));
  const ex = Math.floor(r() * N);
  let x = START[0], y = START[1]; const path = [[x, y]];
  for (let row = START[1]; row >= 0; row--) {
    const target = row === 0 ? ex : Math.floor(r() * N);
    while (x !== target) { x += Math.sign(target - x); path.push([x, y]); }
    if (row > 0) { y--; path.push([x, y]); }
  }
  const onPath = new Set(path.map(p => p.join()));
  const free = []; for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) if (!onPath.has(i + ',' + j)) free.push(i + ',' + j);
  const pick = () => Math.floor(r() * 10);
  return { seed, stage: 1, code, entered: [], glyph, exit: [ex, 0], traps: shuffle(r, free).slice(0, 8), walker: null, steps: 0,
    valves: [pick(), pick(), pick()], trims: [0, 0, 0], wobble: [0, 0, 0], targets: [0, 0, 0].map(() => 2 + Math.floor(r() * 6)),
    hold: 0, need: 5, ticks: 0, paused: false, strikes: 0,
    msg: 'New Voyage. The Lower Deck and the Upper Deck are sealed off from each other.', msgTo: 0 };
}
const gauges = s => s.valves.map((v, i) => v + s.trims[i] + s.wobble[i]);
const inBand = s => gauges(s).every((g, i) => Math.abs(g - s.targets[i]) <= 1);
const isTrap = (s, i, j) => s.traps.includes(i + ',' + j);
function act(s0, a) {
  const s = structuredClone(s0);
  const say = (m, to = 0) => { s.msg = m; s.msgTo = to; return s; };
  const no = m => say('(ignored) ' + m, a.p);
  switch (a.t) {
    case 'sym':
      if (s.stage !== 1 || a.p !== 1) return no('The keypad only answers in stage 1.');
      s.entered.push(a.v);
      if (s.entered.length < 3) return say('Pressed ' + a.v + '.', 1);
      if (s.entered.join() === s.code.join()) { s.stage = 2; s.entered = []; s.walker = { x: START[0], y: START[1] }; return say('Click. The cabinet swings open in the Engine Room, and in the Wheelhouse the rope across the rotten floor drops.'); }
      s.entered = []; s.strikes++; return say('Buzz. Wrong code; the keypad resets. (+1 strike)');
    case 'clear':
      if (s.stage !== 1 || a.p !== 1) return no('Nothing to clear.');
      s.entered = []; return say('Keypad cleared.', 1);
    case 'step': {
      if (s.stage !== 2 || a.p !== 2) return no('Only the Wheelhouse walks the floor, and only in stage 2.');
      const { x, y } = a.v, w = s.walker;
      if (x < 0 || y < 0 || x >= N || y >= N) return no('That way is a wall.');
      if (Math.abs(x - w.x) + Math.abs(y - w.y) !== 1) return no('One step at a time, onto a tile beside you.');
      s.steps++;
      if (isTrap(s, x, y)) { s.walker = { x: START[0], y: START[1] }; s.strikes++; return say('Crack! The boards give way and you scramble back to the start. (+1 strike)'); }
      s.walker = { x, y };
      if (x === s.exit[0] && y === s.exit[1]) { s.stage = 3; return say('You reach the instrument wall. Down in the Engine Room, the valves unseize. The pressure is climbing.'); }
      return say('Stepped onto a ' + s.glyph[y][x] + '.', 2);
    }
    case 'valve':
      if (s.stage !== 3 || a.p !== 1) return no('The valves only turn in stage 3.');
      s.valves[a.v.i] = clamp(s.valves[a.v.i] + a.v.d, 0, 9); return say('Turned valve ' + (a.v.i + 1) + '.', 1);
    case 'trim':
      if (s.stage !== 3 || a.p !== 2) return no('The trims only work in stage 3.');
      s.trims[a.v.i] = clamp(s.trims[a.v.i] + a.v.d, -2, 2); return say('Trimmed gauge ' + (a.v.i + 1) + '.', 2);
    case 'tick': {
      if (s.stage !== 3 || s.paused) return s;
      s.ticks++;
      if (s.ticks % 4 === 0) { const r = rng(s.seed * 1000 + s.ticks), i = Math.floor(r() * 3); s.wobble[i] = clamp(s.wobble[i] + (r() < .5 ? -1 : 1), -2, 2); say('Gauge ' + (i + 1) + ' drifts.', 2); }
      s.hold = inBand(s) ? s.hold + 1 : 0;
      if (s.hold >= s.need) { s.stage = 4; say('Stable for ' + s.need + ' seconds. The door unbolts. Both aboard: the Lifeboat is away!'); }
      return s;
    }
    case 'pause': s.paused = !s.paused; return say(s.paused ? 'Clock paused (prototype only).' : 'Clock running.');
  }
  return no('Unknown action.');
}

/* ============================================================
   ROOM DATA: one description per Deck's Room. Metres; x west→east, z north→south; yaw 0 looks north.
   A Puzzle is a panel on a wall (wall + position along it + centre height + plate size). The renderer builds
   the controls; the rules above never learn about them.
   ============================================================ */
const REACH = 2.2, SLOP = 22, MIN_TARGET = 44;
const ROOMS = {
  1: { name: 'Engine Room', deck: 'Lower Deck', w: 8, d: 7, h: 3, floor: 0x3f3a35, wall: 0x6f5f50, ceil: 0x221d19, lamp: 0xffcf8a, start: { x: 0.4, z: 2.8, yaw: -0.1 },
    solids: [{ x: -3.2, z: 2.6, sx: 1.4, sz: 1.6 }, { x: 2.6, z: 2.6, sx: 1.2, sz: 1.0 }, { x: -0.2, z: -0.2, sx: 1.6, sz: 1.2 }],
    ords: [
      { id: 'rack', label: 'Tool rack', wall: 'N', at: -3.0, y: 1.5, w: 0.9, h: 0.7, text: 'Spanners hang in size order. Every one is oily and none is missing.' },
      { id: 'plate', label: "Maker's plate", wall: 'E', at: 2.4, y: 1.5, w: 0.6, h: 0.4, text: '"Harland & Sons, Belfast, 1907." Someone has scratched a tally of days beside it.' },
      { id: 'lifebelt', label: 'Lifebelt', wall: 'W', at: -2.4, y: 1.6, w: 0.6, h: 0.6, text: "A cork lifebelt, stencilled with the ship's name. The paint is flaking." },
    ],
    things: [
      { id: 'keypad', label: 'Keypad', wall: 'N', at: -1.5, y: 1.45, w: 0.64, h: 0.9 },
      { id: 'cabinet', label: 'Cabinet', wall: 'E', at: 0, y: 1.4, w: 1.0, h: 1.0 },
      { id: 'valves', label: 'Valve wheels', wall: 'W', at: 0, y: 1.35, w: 2.1, h: 1.1 },
    ] },
  2: { name: 'Wheelhouse', deck: 'Upper Deck', w: 8, d: 7, h: 2.6, floor: 0x2b2622, wall: 0x6b6f7a, ceil: 0x1f2023, lamp: 0xbfd4ff, tiles: true, start: { x: 0, z: 3.0, yaw: 0 },
    solids: [{ x: -3.2, z: 2.9, sx: 1.0, sz: 0.8 }],
    ords: [
      { id: 'barometer', label: 'Barometer', wall: 'W', at: 2.8, y: 1.5, w: 0.6, h: 0.6, text: 'The needle sits well below STORMY, and has stopped there.' },
      { id: 'pipe', label: 'Voice Pipe', wall: 'S', at: -1.0, y: 1.3, w: 0.5, h: 0.7, text: 'A brass mouthpiece on a tube that runs down through the deck. Speak up: your partner is at the other end.' },
      { id: 'chart', label: 'Chart', wall: 'S', at: 1.5, y: 1.5, w: 1.0, h: 0.7, text: 'A chart of a coast that has already slid past the window.' },
    ],
    things: [
      { id: 'mural', label: 'Mural', wall: 'E', at: 2.4, y: 1.45, w: 1.5, h: 1.0 },
      { id: 'gauges', label: 'Instrument wall', wall: 'N', at: 0, y: 1.5, w: 2.4, h: 1.3 },
    ] },
};
const tileXZ = (i, j) => ({ x: i - 2, z: -2.5 + j });
const tileAt = (x, z) => [Math.floor(x + 2.5), Math.floor(z + 3)];
const wallPose = (R, th) => ({ N: { x: th.at, z: -R.d / 2, yaw: 0 }, S: { x: th.at, z: R.d / 2, yaw: Math.PI }, W: { x: -R.w / 2, z: th.at, yaw: Math.PI / 2 }, E: { x: R.w / 2, z: th.at, yaw: -Math.PI / 2 } })[th.wall];
const HINT = {
  1: ['', 'A keypad by the door. A locked cabinet. Valve wheels rusted solid.', 'The cabinet is open: a plan of some floor that isn\'t this one.', 'The valve wheels turn now, but there are no gauges down here.', 'The door is open.'],
  2: ['', 'A faded mural. A rope across a dark, rotten floor.', 'You\'re on the dark floor. Only the tiles beside you are lit.', 'The instrument wall: keep every gauge in its band.', 'Something below unbolts.'],
};

/* ============================================================
   STATE (shared across windows through localStorage; the pose is never shared)
   ============================================================ */
const KEY = 'PROTOTYPE-usable-cue-wipe-me', WIN = Math.random().toString(36).slice(2);
const q = new URLSearchParams(location.search);
const coarse = matchMedia('(pointer:coarse)').matches;
const cfg = { variant: q.get('variant') || 'B', deck: +(q.get('deck') || 1), cross: q.get('cross') || 'free', stick: coarse || q.get('stick') === '1', miss: +(q.get('miss') ?? 3), ords: q.get('ords') || 'cued' };
const wantLock = () => !cfg.stick && q.get('lock') !== '0' && cfg.variant !== 'E';
cfg.lock = wantLock();
const VARIANTS = {
  A: { name: 'No cue (control)', help: 'Nothing marks what can be used. Walk up, aim, press. Notice how you find the keypad.' },
  B: { name: 'Glow', help: 'A brass glow rims a live thing that is in reach and in front of you; brighter under the crosshair. It needs no hover, so it works on touch.' },
  C: { name: 'Reticle', help: "The crosshair (a centre dot on touch) turns into a ring and names what you face. On touch a tap still lands where you tap: the dot only says what is near the centre." },
  D: { name: 'Pilot lamp', help: 'Each machine wears a small brass lamp: dark when idle or out of reach, lit amber when you are close enough to use it.' },
  E: { name: 'Cursor', help: 'The mouse cursor turns to a hand over a live thing (this variant uses point-and-click). On touch there is no hover, so on a phone this is variant A.' },
};
const MISS = ['off', 'ripple', 'ripple + tock', 'ripple + tock + words'], ORDS = { cued: 'cued like the rest', plain: 'plain, no cue', off: 'none' };
const mode = () => 'place';
let state, deck = cfg.deck;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY))?.s; } catch { return null; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ s: state, from: WIN })); } catch {} };

addEventListener('storage', e => { if (e.key === KEY && e.newValue) { const prev = state; state = JSON.parse(e.newValue).s; onState(prev); } });

/* ============================================================
   THE 2D CLOSE-UP (variant C, and D on small screens): the C10 baseline. Reads only what this Deck may see.
   ============================================================ */
const bt = (p, t, v, label, cls = '') => `<button class="b ${cls}" data-p="${p}" data-t="${t}" data-v='${JSON.stringify(v ?? null)}'>${label}</button>`;

    warp: (x, z, yaw = 0, pitch = -0.1) => Object.assign(P, { x, z, yaw, pitch }), focus, unfocus, mode, tapAt };
}
